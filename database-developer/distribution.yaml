name: database-developer
version: 1.0.18
description: 'Database developer: Postgres, SQL, modelagem, migrações e otimização
  de queries.'
author: Matheus Carvalho
license: MIT
hermes_requires: '>=0.12.0'
env_requires:
- name: CONTEXT7_API_KEY
