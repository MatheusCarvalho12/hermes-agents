      OPENFINANCE_PROXY_SECRET: op://Hermes/qt2gasua4xmzgk4rw2lxigochy/OPENFINANCE_PROXY_SECRET
      TEST_CNPJ: op://Hermes/qt2gasua4xmzgk4rw2lxigochy/TEST_CNPJ
      SISCARGA_PROXY_SECRET: op://Hermes/qt2gasua4xmzgk4rw2lxigochy/SISCARGA_PROXY_SECRET
      SISCARGA_NOTE: op://Hermes/qt2gasua4xmzgk4rw2lxigochy/SISCARGA_NOTE
      SISCARGA_PROVIDER_URL: op://Hermes/qt2gasua4xmzgk4rw2lxigochy/SISCARGA_PROVIDER_URL
    account: my.1password.com
_config_version: 33
session_reset:
  mode: none
  idle_minutes: 1440
  at_hour: 4
group_sessions_per_user: true
platform_toolsets:
  cli:
    - hermes-cli
  telegram:
    - hermes-telegram
  discord:
    - hermes-discord
  whatsapp:
    - hermes-whatsapp
  slack:
    - hermes-slack
  signal:
    - hermes-signal
  homeassistant:
    - hermes-homeassistant
  qqbot:
    - hermes-qqbot
  yuanbao:
    - hermes-yuanbao
  teams:
    - hermes-teams
  google_chat:
    - hermes-google_chat
image_gen:
  use_gateway: false
  provider: openai-codex
  model: gpt-image-2-high
plugins:
  enabled:
    - rtk-rewrite
mcp_servers:
  geonode:
    url: https://scraper.geonode.io/mcp
    headers:
      X-Api-Key: geonode_I73nuoLh7H
    timeout: 180

# ── Fallback Model ────────────────────────────────────────────────────
# Automatic provider failover when primary is unavailable.
# Uncomment and configure to enable. Triggers on rate limits (429),
# overload (529), service errors (503), or connection failures.
#
# Supported providers:
#   openrouter   (OPENROUTER_API_KEY)  — routes to any model
#   openai-codex (OAuth — hermes auth) — OpenAI Codex
#   nous         (OAuth — hermes auth) — Nous Portal
#   zai          (ZAI_API_KEY)         — Z.AI / GLM
#   kimi-coding  (KIMI_API_KEY)        — Kimi / Moonshot
#   kimi-coding-cn (KIMI_CN_API_KEY)   — Kimi / Moonshot (China)
#   minimax      (MINIMAX_API_KEY)     — MiniMax
#   minimax-cn   (MINIMAX_CN_API_KEY)  — MiniMax (China)
#   bedrock      (AWS IAM / boto3)     — AWS Bedrock (Converse API)
#
# For custom OpenAI-compatible endpoints, add base_url and key_env.
#
# fallback_model:
#   provider: openrouter
#   model: anthropic/claude-sonnet-4
